name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_FRONTEND_URI: ${{ secrets.ECR_FRONTEND_URI }}
      ECR_BACKEND_URI: ${{ secrets.ECR_BACKEND_URI }}
      NAMESPACE_DEFAULT: default

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pre-import ECR repos if they already exist
        working-directory: ./terraform
        run: |
          set +e

          echo "Checking if ECR repositories already exist..."

          # Frontend
          aws ecr describe-repositories --repository-names employee-madness-frontend >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "Importing existing frontend repository..."
            terraform import aws_ecr_repository.frontend employee-madness-frontend || true
          else
            echo "Frontend repo does not exist yet — Terraform will create it."
          fi

          # Backend
          aws ecr describe-repositories --repository-names employee-madness-backend >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "Importing existing backend repository..."
            terraform import aws_ecr_repository.backend employee-madness-backend || true
          else
            echo "Backend repo does not exist yet — Terraform will create it."
          fi

          set -e

      - name: Terraform Init + Apply
        working-directory: ./terraform
        run: |
          export TF_WARN_OUTPUT_ERRORS=1
          terraform init -input=false
          terraform apply -auto-approve

          CLUSTER_NAME=$(terraform output -raw eks_cluster_name | tr -d '\n\r')
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - name: Deploy backend
        run: |
          kubectl apply -f k8s/server.yaml
          kubectl rollout status deployment/server -n $NAMESPACE_DEFAULT

      - name: Deploy frontend
        run: |
          FRONTEND_TAG=$(cat $GITHUB_ENV | grep FRONTEND_TAG | cut -d '=' -f2)
          kubectl set image deployment/client client=$ECR_FRONTEND_URI:$FRONTEND_TAG -n $NAMESPACE_DEFAULT
          kubectl rollout status deployment/client -n $NAMESPACE_DEFAULT

      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=server -n $NAMESPACE_DEFAULT --timeout=180s
          kubectl wait --for=condition=ready pod -l app=client -n $NAMESPACE_DEFAULT --timeout=180s
