name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      NAMESPACE_DEFAULT: default

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Fetch Terraform outputs
        working-directory: ./terraform   # <-- set this to the folder where your terraform files are
        run: |
          terraform init -input=false
          CLUSTER_NAME=$(terraform output -raw eks_cluster_name)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      - name: Deploy backend
        run: |
          kubectl apply -f k8s/server.yaml
          kubectl rollout status deployment/server -n $NAMESPACE_DEFAULT

      - name: Deploy frontend
        run: |
          FRONTEND_TAG=$(cat $GITHUB_ENV | grep FRONTEND_TAG | cut -d '=' -f2)
          kubectl set image deployment/client client=$ECR_FRONTEND_URI:$FRONTEND_TAG -n $NAMESPACE_DEFAULT
          kubectl rollout status deployment/client -n $NAMESPACE_DEFAULT

      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=server -n $NAMESPACE_DEFAULT --timeout=180s
          kubectl wait --for=condition=ready pod -l app=client -n $NAMESPACE_DEFAULT --timeout=180s


