name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_FRONTEND_URI: ${{ secrets.ECR_FRONTEND_URI }}
      ECR_BACKEND_URI: ${{ secrets.ECR_BACKEND_URI }}
      NAMESPACE_DEFAULT: default

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Terraform Init
      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -input=false

      # Pre-import resources only if they exist
      - name: Pre-import AWS resources
        working-directory: ./terraform
        run: |
          set +e
          echo "Checking existing AWS resources..."

          aws ecr describe-repositories --repository-names employee-madness-frontend >/dev/null 2>&1 \
            && terraform import aws_ecr_repository.frontend employee-madness-frontend || true

          aws ecr describe-repositories --repository-names employee-madness-backend >/dev/null 2>&1 \
            && terraform import aws_ecr_repository.backend employee-madness-backend || true

          aws iam get-role --role-name employee-madness-cluster-eks-role >/dev/null 2>&1 \
            && terraform import aws_iam_role.eks_role employee-madness-cluster-eks-role || true

          aws iam get-role --role-name employee-madness-cluster-node-role >/dev/null 2>&1 \
            && terraform import aws_iam_role.node_role employee-madness-cluster-node-role || true

          aws eks describe-cluster --name employee-madness-cluster >/dev/null 2>&1 \
            && terraform import aws_eks_cluster.my_cluster employee-madness-cluster || true

          aws eks describe-nodegroup --cluster-name employee-madness-cluster --nodegroup-name employee-madness-nodegroup >/dev/null 2>&1 \
            && terraform import aws_eks_node_group.node_group employee-madness-cluster:employee-madness-nodegroup || true

          set -e

      # Terraform Apply
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

      # SAFELY EXPORT EKS CLUSTER NAME
      - name: Export Cluster Name
        working-directory: ./terraform
        run: |
          echo "CLUSTER_NAME=$(terraform output -raw eks_cluster_name)" >> $GITHUB_ENV

      # UPDATE KUBECONFIG
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $CLUSTER_NAME

      # DEPLOY BACKEND
      - name: Deploy backend
        run: |
          kubectl apply -f k8s/server.yaml
          kubectl rollout status deployment/server -n $NAMESPACE_DEFAULT

      # LOAD FRONTEND TAG FROM CI ARTIFACT
      - name: Load Frontend Tag
        run: |
          echo "FRONTEND_TAG=$(cat frontend_tag.txt)" >> $GITHUB_ENV

      # DEPLOY FRONTEND
      - name: Deploy frontend
        run: |
          kubectl set image deployment/client client=$ECR_FRONTEND_URI:$FRONTEND_TAG -n $NAMESPACE_DEFAULT
          kubectl rollout status deployment/client -n $NAMESPACE_DEFAULT

      # WAIT FOR PODS
      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=server -n $NAMESPACE_DEFAULT --timeout=180s
          kubectl wait --for=condition=ready pod -l app=client -n $NAMESPACE_DEFAULT --timeout=180s

