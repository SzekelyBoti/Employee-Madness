name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [development]

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: eu-north-1
      CLUSTER_NAME: employee-madness-cluster
      NAMESPACE_DEFAULT: default
      NAMESPACE_MONITOR: monitoring
      FRONTEND_ECR_NAME: employee-madness-frontend
      BACKEND_ECR_NAME: employee-madness-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download CI build tag
        uses: actions/download-artifact@v4
        with:
          name: build-tag
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read build tag from CI
        id: read-tag
        run: |
          if [ -f "frontend_tag.txt" ]; then
            CI_TAG=$(cat frontend_tag.txt)
            echo "CI_BUILD_TAG=$CI_TAG" >> $GITHUB_ENV
            echo "Using build tag from CI: $CI_TAG"
          else
            CI_TAG=$(date +%s)
            echo "CI_BUILD_TAG=$CI_TAG" >> $GITHUB_ENV
            echo "Generated new tag: $CI_TAG (CI artifact not found)"
          fi

      - name: Clean up duplicate state files
        run: |
          if [ -f "terraform.tfstate" ]; then
            echo "Moving duplicate state file to terraform directory..."
            mv terraform.tfstate terraform/ || true
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y kubectl jq gettext-base curl
          
          # Install Helm from official script
          echo "Installing Helm..."
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          # Verify installations
          kubectl version --client
          helm version

      # ========== ECR SETUP ==========
      - name: Setup ECR repositories
        id: ecr-setup
        run: |
          setup_ecr() {
            local repo_name=$1
            local output_var=$2
          
            if aws ecr describe-repositories --repository-names "$repo_name" > /dev/null 2>&1; then
              echo "ECR repository '$repo_name' exists"
              REPO_URI=$(aws ecr describe-repositories --repository-names "$repo_name" --query 'repositories[0].repositoryUri' --output text)
            else
              echo "Creating ECR repository '$repo_name'..."
              aws ecr create-repository --repository-name "$repo_name" --region ${{ env.AWS_REGION }}
              REPO_URI=$(aws ecr describe-repositories --repository-names "$repo_name" --query 'repositories[0].repositoryUri' --output text)
            fi
            echo "$output_var=$REPO_URI" >> $GITHUB_OUTPUT
          }
          
          setup_ecr "${{ env.FRONTEND_ECR_NAME }}" "FRONTEND_ECR_URI"
          setup_ecr "${{ env.BACKEND_ECR_NAME }}" "BACKEND_ECR_URI"

      # ========== EKS CLUSTER CHECK ==========
      - name: Check EKS cluster status
        id: eks-check
        run: |
          if aws eks describe-cluster --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
            echo "EKS cluster '${{ env.CLUSTER_NAME }}' exists"
            CLUSTER_STATUS=$(aws eks describe-cluster --name "${{ env.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" --query 'cluster.status' --output text)
            echo "CLUSTER_EXISTS=true" >> $GITHUB_OUTPUT
            echo "CLUSTER_STATUS=$CLUSTER_STATUS" >> $GITHUB_OUTPUT
          
            if [ "$CLUSTER_STATUS" = "ACTIVE" ]; then
              aws eks update-kubeconfig --region "${{ env.AWS_REGION }}" --name "${{ env.CLUSTER_NAME }}"
              echo "KUBECONFIG_UPDATED=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "EKS cluster '${{ env.CLUSTER_NAME }}' does not exist"
            echo "CLUSTER_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      # ========== TERRAFORM (Only if needed) ==========
      - name: Setup Terraform
        if: steps.eks-check.outputs.CLUSTER_EXISTS != 'true'
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.9.0

      - name: Initialize Terraform
        if: steps.eks-check.outputs.CLUSTER_EXISTS != 'true'
        working-directory: ./terraform
        run: terraform init

      - name: Apply Terraform
        if: steps.eks-check.outputs.CLUSTER_EXISTS != 'true'
        working-directory: ./terraform
        run: |
          terraform import aws_ecr_repository.frontend "${{ env.FRONTEND_ECR_NAME }}" || echo "Frontend ECR not in Terraform state"
          terraform import aws_ecr_repository.backend "${{ env.BACKEND_ECR_NAME }}" || echo "Backend ECR not in Terraform state"
          
          terraform apply -auto-approve -input=false
          
          EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "${{ env.CLUSTER_NAME }}")
          echo "EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME" >> $GITHUB_ENV

      # ========== SET ENVIRONMENT VARIABLES ==========
      - name: Set deployment variables
        run: |
          if [ "${{ steps.eks-check.outputs.CLUSTER_EXISTS }}" = "true" ]; then
            echo "Using existing cluster: ${{ env.CLUSTER_NAME }}"
            echo "EKS_CLUSTER_NAME=${{ env.CLUSTER_NAME }}" >> $GITHUB_ENV
          fi
          
          echo "ECR_FRONTEND_URI=${{ steps.ecr-setup.outputs.FRONTEND_ECR_URI }}" >> $GITHUB_ENV
          echo "ECR_BACKEND_URI=${{ steps.ecr-setup.outputs.BACKEND_ECR_URI }}" >> $GITHUB_ENV
          
          if [ -z "${{ env.EKS_CLUSTER_NAME }}" ]; then
            echo "EKS_CLUSTER_NAME=${{ env.CLUSTER_NAME }}" >> $GITHUB_ENV
          fi

      # ========== VERIFY KUBECTL ACCESS ==========
      - name: Verify kubectl access
        run: |
          echo "Configuring kubectl for cluster: ${{ env.EKS_CLUSTER_NAME }}"
          
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --alias "${{ env.EKS_CLUSTER_NAME }}"
          
          echo "=== Testing kubectl access ==="
          kubectl cluster-info || echo "Cluster info not available yet"
          kubectl get nodes --request-timeout=30s || echo "Nodes not available yet - cluster may still be initializing"

      # ========== DEPLOY BACKEND FIRST ==========
      - name: Deploy backend
        run: |
          echo "Deploying backend..."
          kubectl create namespace "${{ env.NAMESPACE_DEFAULT }}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/server.yaml -n "${{ env.NAMESPACE_DEFAULT }}"
          echo "Waiting for backend service..."
          sleep 10

      # ========== GET BACKEND LOAD BALANCER ==========
      - name: Get backend LoadBalancer URL
        id: get-backend-lb
        run: |
          echo "Waiting for backend LoadBalancer..."
          BACKEND_HOST=""
          for i in {1..30}; do
            BACKEND_HOST=$(kubectl get svc server -n "${{ env.NAMESPACE_DEFAULT }}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$BACKEND_HOST" ]; then
              echo "API_URL=http://$BACKEND_HOST:8080" >> $GITHUB_ENV
              echo "Backend LoadBalancer: $BACKEND_HOST"
              break
            fi
            echo "Attempt $i/30: LoadBalancer not ready yet..."
            sleep 5
          done
          
          if [ -z "$BACKEND_HOST" ]; then
            echo "WARNING: Could not get LoadBalancer hostname"
            echo "API_URL=http://localhost:8080" >> $GITHUB_ENV
          fi

      # ========== BUILD AND PUSH PRODUCTION IMAGES ==========
      - name: Build and push production frontend image
        env:
          REACT_APP_API_URL: ${{ env.API_URL }}
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | \
            docker login --username AWS --password-stdin "${{ env.ECR_FRONTEND_URI }}"
          
          PROD_TAG="${{ env.CI_BUILD_TAG }}-prod"
          echo "FRONTEND_PROD_TAG=$PROD_TAG" >> $GITHUB_ENV
          
          echo "Building production frontend with API_URL: $REACT_APP_API_URL"
          docker build \
            --build-arg REACT_APP_API_URL="$REACT_APP_API_URL" \
            -t frontend:$PROD_TAG ./client
          
          docker tag frontend:$PROD_TAG "${{ env.ECR_FRONTEND_URI }}:$PROD_TAG"
          docker push "${{ env.ECR_FRONTEND_URI }}:$PROD_TAG"
          
          docker tag frontend:$PROD_TAG "${{ env.ECR_FRONTEND_URI }}:latest"
          docker push "${{ env.ECR_FRONTEND_URI }}:latest"
          
          echo "Frontend image pushed: ${{ env.ECR_FRONTEND_URI }}:$PROD_TAG"

      - name: Build and push production backend image
        run: |
          aws ecr get-login-password --region "${{ env.AWS_REGION }}" | \
            docker login --username AWS --password-stdin "${{ env.ECR_BACKEND_URI }}"
          
          PROD_TAG="${{ env.CI_BUILD_TAG }}-prod"
          echo "Building production backend..."
          
          docker build -t backend:$PROD_TAG ./server
          docker tag backend:$PROD_TAG "${{ env.ECR_BACKEND_URI }}:$PROD_TAG"
          docker push "${{ env.ECR_BACKEND_URI }}:$PROD_TAG"
          
          docker tag backend:$PROD_TAG "${{ env.ECR_BACKEND_URI }}:latest"
          docker push "${{ env.ECR_BACKEND_URI }}:latest"
          
          echo "Backend image pushed: ${{ env.ECR_BACKEND_URI }}:$PROD_TAG"

      # ========== DEPLOY MONGODB ==========
      - name: Deploy MongoDB
        run: |
          kubectl apply -f k8s/mongo.yaml -n "${{ env.NAMESPACE_DEFAULT }}"
          
          kubectl wait --for=condition=ready pod -l app=mongo \
            -n "${{ env.NAMESPACE_DEFAULT }}" \
            --timeout=120s || echo "MongoDB might still be starting"

      # ========== UPDATE DEPLOYMENTS ==========
      - name: Update backend deployment with production image
        run: |
          kubectl set image deployment/server \
            server="${{ env.ECR_BACKEND_URI }}:${{ env.CI_BUILD_TAG }}-prod" \
            -n "${{ env.NAMESPACE_DEFAULT }}" || echo "Backend update might have failed"
          
          kubectl rollout status deployment/server \
            -n "${{ env.NAMESPACE_DEFAULT }}" \
            --timeout=180s || echo "Backend rollout check failed"

      - name: Deploy or update frontend
        run: |
          if kubectl get deployment client -n "${{ env.NAMESPACE_DEFAULT }}" > /dev/null 2>&1; then
            echo "Updating existing frontend deployment..."
            kubectl set image deployment/client \
              client="${{ env.ECR_FRONTEND_URI }}:${{ env.FRONTEND_PROD_TAG }}" \
              -n "${{ env.NAMESPACE_DEFAULT }}"
          else
            echo "Creating new frontend deployment..."
            kubectl apply -f k8s/client.yaml -n "${{ env.NAMESPACE_DEFAULT }}"
            kubectl set image deployment/client \
              client="${{ env.ECR_FRONTEND_URI }}:${{ env.FRONTEND_PROD_TAG }}" \
              -n "${{ env.NAMESPACE_DEFAULT }}"
          fi
          
          kubectl rollout status deployment/client \
            -n "${{ env.NAMESPACE_DEFAULT }}" \
            --timeout=180s || echo "Frontend rollout check failed"

      # ========== SETUP MONITORING ==========
      - name: Setup monitoring namespace
        run: |
          kubectl create namespace "${{ env.NAMESPACE_MONITOR }}" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy monitoring stack
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          
          helm upgrade --install monitoring \
            prometheus-community/kube-prometheus-stack \
            --namespace "${{ env.NAMESPACE_MONITOR }}" \
            --create-namespace \
            --set grafana.adminPassword=admin \
            --wait --timeout=300s

      # ========== POPULATE DATABASE ==========
      - name: Populate database
        run: |
          kubectl delete job employees-populate -n "${{ env.NAMESPACE_DEFAULT }}" --ignore-not-found
          kubectl apply -f k8s/populate-job.yaml -n "${{ env.NAMESPACE_DEFAULT }}"
          kubectl wait --for=condition=complete job/employees-populate \
            -n "${{ env.NAMESPACE_DEFAULT }}" \
            --timeout=120s || echo "Population job may have failed"

      # ========== VERIFY DEPLOYMENT ==========
      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=server \
            -n "${{ env.NAMESPACE_DEFAULT }}" \
            --timeout=180s || echo "Backend pods not ready"
          
          kubectl wait --for=condition=ready pod -l app=client \
            -n "${{ env.NAMESPACE_DEFAULT }}" \
            --timeout=180s || echo "Frontend pods not ready"
          
          kubectl wait --for=condition=ready pod -l app=mongo \
            -n "${{ env.NAMESPACE_DEFAULT }}" \
            --timeout=120s || echo "MongoDB pods not ready"

      # ========== DISPLAY RESULTS ==========
      - name: Display deployment summary
        run: |
          echo "## 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${{ env.EKS_CLUSTER_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Tag:** ${{ env.CI_BUILD_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Tag:** ${{ env.CI_BUILD_TAG }}-prod" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          FRONTEND_URL=$(kubectl get svc client -n "${{ env.NAMESPACE_DEFAULT }}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "Pending...")
          BACKEND_URL=$(kubectl get svc server -n "${{ env.NAMESPACE_DEFAULT }}" -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "Pending...")
          
          echo "**Application URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend:** [http://$FRONTEND_URL](http://$FRONTEND_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend API:** [http://$BACKEND_URL:8080](http://$BACKEND_URL:8080)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Pod Status:**" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n "${{ env.NAMESPACE_DEFAULT }}" -o wide 2>/dev/null | sed 's/^/  /' >> $GITHUB_STEP_SUMMARY || echo "  Unable to get pod status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "**Monitoring:**" >> $GITHUB_STEP_SUMMARY
          echo "- Grafana: \`kubectl port-forward svc/monitoring-grafana 3000:80 -n ${{ env.NAMESPACE_MONITOR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Prometheus: \`kubectl port-forward svc/monitoring-kube-prometheus-prometheus 9090:9090 -n ${{ env.NAMESPACE_MONITOR }}\`" >> $GITHUB_STEP_SUMMARY
          
          echo "✅ Deployment Complete!"
          echo "Frontend URL: http://$FRONTEND_URL"
          echo "Backend API URL: http://$BACKEND_URL:8080"

