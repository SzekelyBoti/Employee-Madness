name: CI

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        run: |
          cd client
          npm run build

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Run tests
        run: |
          cd server
          npm test -- --watchAll=false

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_FRONTEND_URI: ${{ secrets.ECR_FRONTEND_URI }}
      ECR_BACKEND_URI: ${{ secrets.ECR_BACKEND_URI }}

    steps:
      - uses: actions/checkout@v3

      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_FRONTEND_URI

      - name: Build and Push Frontend
        run: |
          TAG=$(date +%s)
          docker build --build-arg REACT_APP_API_URL=http://placeholder:8080 -t frontend:$TAG ./client
          docker tag frontend:$TAG $ECR_FRONTEND_URI:$TAG
          docker push $ECR_FRONTEND_URI:$TAG
          echo "FRONTEND_TAG=$TAG" >> $GITHUB_ENV

      - name: Build and Push Backend
        run: |
          docker build -t backend ./server
          docker tag backend:latest $ECR_BACKEND_URI:latest
          docker push $ECR_BACKEND_URI:latest
