name: CI

on:
  push:
    branches:
      - development
  pull_request:

jobs:
  validate:
    name: Validate Builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd client
          npm ci
          CI=false REACT_APP_API_URL=http://localhost:8080 npm run build
          echo "Frontend builds successfully"

      - name: Build Docker images (development only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        run: |
          # Generate build tag
          TAG=$(date +%s)
          echo "$TAG" > frontend_tag.txt
          
          # Build Docker images to verify they work
          docker build -t frontend:$TAG ./client
          docker build -t backend:$TAG ./server
          echo "Docker images built successfully"

      - name: Upload build tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        uses: actions/upload-artifact@v4
        with:
          name: build-tag
          path: frontend_tag.txt