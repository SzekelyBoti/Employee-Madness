version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: employeesdb
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    environment:
      PORT: 8080
      MONGO_URL: mongodb://mongo:27017/employeesdb
      NODE_ENV: production
    depends_on:
      - mongo
    ports:
      - "8080:8080"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    environment:
      REACT_APP_API_URL: http://localhost:8080
      NODE_ENV: production
    depends_on:
      - server
    ports:
      - "3000:80"

volumes:
  mongo_data:
